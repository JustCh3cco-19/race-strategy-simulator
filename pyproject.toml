[project]
name = "race-strategy-simulator"
version = "0.1.0"
description = "Configurable motorsport race strategy simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "pyyaml>=6.0", "typer>=0.12"]

[project.scripts]
race-strategy = "race_strategy.cli:app"

[dependency-groups]
dev = ["mypy>=1.10", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/race_strategy"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

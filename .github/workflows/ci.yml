name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run pytest

      - name: Check formatting and lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy race_strategy
